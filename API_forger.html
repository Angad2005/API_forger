<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Forge Pro with Gemini AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { 'gray': { 850: '#18202F', 950: '#0b0f1a' } },
                    keyframes: {
                        'modal-in': { '0%': { transform: 'scale(0.95)', opacity: '0' }, '100%': { transform: 'scale(1)', opacity: '1' } },
                        'modal-out': { '0%': { transform: 'scale(1)', opacity: '1' }, '100%': { transform: 'scale(0.95)', opacity: '0' } },
                        'spin': { 'to': { transform: 'rotate(360deg)' } },
                    },
                    animation: { 
                        'modal-in': 'modal-in 0.2s ease-out forwards', 
                        'modal-out': 'modal-out 0.2s ease-in forwards',
                        'spin': 'spin 1s linear infinite',
                    }
                }
            }
        }
    </script>
    <style>
        :root { --main-bg: #0b0f1a; --panel-bg: #18202F; --border-color: #374151; --text-color: #d1d5db; --text-light: #9ca3af; --accent-blue: #3b82f6; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--panel-bg); }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }

        .json-key { color: #9cdcfe; } .json-string { color: #ce9178; } .json-number { color: #b5cea8; } .json-boolean { color: #569cd6; } .json-null { color: #569cd6; }
        .active-request, .active-tab { background-color: #374151 !important; border-left-color: var(--accent-blue) !important; color: white !important; }
        .tab-btn.active { border-bottom-color: var(--accent-blue); color: white; }
        .tree .item { padding-left: calc(var(--level, 0) * 1rem); } .tree .folder > .item-content::before { content: '▶'; margin-right: 0.5rem; display: inline-block; transition: transform 0.1s; } .tree .folder.open > .item-content::before { transform: rotate(90deg); }
        .modal-content.animate-in { animation: modal-in; } .modal-content.animate-out { animation: modal-out; }
    </style>
</head>
<body class="bg-gray-950 text-gray-300 font-sans antialiased">

    <!-- Main Application Wrapper -->
    <div id="app" class="h-screen w-screen flex flex-col">
        
        <!-- Header -->
        <header class="bg-gray-850 p-2 flex items-center justify-between border-b border-gray-700 shadow-md flex-shrink-0">
            <div class="flex items-center space-x-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-blue-500"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></svg>
                <h1 class="text-xl font-bold text-white">API Forge Pro ✨</h1>
            </div>
            <div class="flex items-center space-x-3">
                <div class="flex items-center">
                    <span class="text-sm mr-2 text-gray-400 hidden sm:inline">Environment:</span>
                    <select id="environment-selector" class="bg-gray-700 text-white py-1 px-2 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="none">No Environment</option>
                    </select>
                </div>
                <button id="settings-button" class="bg-gray-700 hover:bg-gray-600 text-white font-semibold py-2 px-3 rounded-lg transition-colors text-sm flex items-center space-x-2" title="Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
                <button id="environments-button" class="bg-gray-700 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded-lg transition-colors text-sm">Manage Envs</button>
            </div>
        </header>

        <!-- Main Content Grid -->
        <main class="flex-grow grid grid-cols-1 md:grid-cols-12 gap-2 p-2 overflow-hidden">
            
            <!-- Left Panel: Collections/History -->
            <div class="col-span-1 md:col-span-3 bg-gray-850 rounded-lg flex flex-col overflow-hidden border border-gray-700">
                <div class="p-2 border-b border-gray-700 flex items-center space-x-1">
                    <button class="left-panel-tab flex-1 py-1 px-2 rounded-md text-sm" data-tab="collections">Collections</button>
                    <button class="left-panel-tab flex-1 py-1 px-2 rounded-md text-sm" data-tab="history">History</button>
                </div>
                <div id="collections-panel" class="left-panel-content flex flex-col flex-grow">
                    <div class="p-2 border-b border-gray-700 flex justify-between items-center">
                        <h2 class="font-semibold text-white">Collections</h2>
                        <div class="flex items-center space-x-2">
                            <button id="import-button" title="Import"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></button>
                            <button id="export-button" title="Export"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
                            <button id="new-collection-button" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-1 px-3 rounded-lg text-sm">New</button>
                        </div>
                    </div>
                    <div id="collections-list" class="flex-grow overflow-y-auto p-1 space-y-1 tree"></div>
                </div>
                <div id="history-panel" class="left-panel-content hidden flex flex-col flex-grow">
                    <div class="p-2 border-b border-gray-700 flex justify-between items-center">
                        <h2 class="font-semibold text-white">History</h2>
                        <button id="clear-history-button" class="text-red-500 hover:text-red-400 text-sm">Clear</button>
                    </div>
                    <div id="history-list" class="flex-grow overflow-y-auto p-1 space-y-1"></div>
                </div>
            </div>

            <!-- Center Panel: Request Editor -->
            <div id="center-panel-placeholder" class="hidden md:flex col-span-4 bg-gray-850 rounded-lg border border-gray-700 flex items-center justify-center text-gray-500">
                <p>Select a request or create a new one.</p>
            </div>
            <div id="request-editor" class="col-span-1 md:col-span-4 bg-gray-850 rounded-lg flex flex-col overflow-hidden border border-gray-700 hidden">
                <input id="request-name-input" type="text" class="w-full bg-gray-900 p-2 border-b border-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Unnamed Request">
                <div class="p-2 flex items-center">
                    <select id="method-select" class="bg-gray-700 text-white font-bold py-2 px-3 rounded-l-lg appearance-none focus:outline-none">
                        <option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option>
                    </select>
                    <input id="url-input" type="text" placeholder="Enter URL or use {{variable}}" class="flex-grow bg-gray-900 border-y border-r border-gray-700 py-2 px-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 rounded-r-lg">
                    <button id="send-button" class="ml-2 bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-4 rounded-lg">Send</button>
                </div>
                
                <div class="flex-grow flex flex-col overflow-hidden px-2 pb-2">
                     <div class="flex border-b border-gray-700 mb-2">
                        <button class="tab-btn py-2 px-4 text-gray-400 border-b-2 border-transparent hover:text-white" data-tab="auth">Auth</button>
                        <button class="tab-btn py-2 px-4 text-gray-400 border-b-2 border-transparent hover:text-white" data-tab="headers">Headers</button>
                        <button class="tab-btn py-2 px-4 text-gray-400 border-b-2 border-transparent hover:text-white" data-tab="body">Body</button>
                    </div>
                    <div id="tab-content" class="flex-grow overflow-auto">
                        <div id="auth-content" class="tab-pane hidden p-1 space-y-3">
                            <select id="auth-type-select" class="w-full bg-gray-700 p-2 rounded-md">
                                <option value="none">No Auth</option><option value="bearer">Bearer Token</option><option value="basic">Basic Auth</option><option value="apikey">API Key</option>
                            </select>
                            <div id="auth-fields"></div>
                        </div>
                        <div id="headers-content" class="tab-pane hidden h-full"><textarea id="headers-textarea" class="w-full h-full bg-gray-900 border border-gray-700 rounded-md p-2 text-white font-mono text-sm resize-none focus:outline-none" placeholder='{"Content-Type": "application/json"}'></textarea></div>
                        <div id="body-content" class="tab-pane hidden h-full"><textarea id="body-textarea" class="w-full h-full bg-gray-900 border border-gray-700 rounded-md p-2 text-white font-mono text-sm resize-none focus:outline-none" placeholder='{"key": "value"}'></textarea></div>
                    </div>
                </div>
                 <div class="p-2 border-t border-gray-700 flex flex-wrap gap-2 justify-between items-center">
                    <div class="flex gap-2">
                        <button id="generate-code-button" class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-1 px-3 rounded-lg text-sm">Generate Code</button>
                        <button id="docs-helper-button" class="bg-purple-600 hover:bg-purple-500 text-white font-bold py-1 px-3 rounded-lg text-sm">✨ AI Docs</button>
                    </div>
                    <div class="flex space-x-2">
                         <button id="save-request-button" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-1 px-4 rounded-lg text-sm">Save</button>
                         <button id="delete-request-button" class="bg-red-600 hover:bg-red-500 text-white font-bold py-1 px-3 rounded-lg text-sm">Delete</button>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Response Viewer -->
            <div class="col-span-1 md:col-span-5 bg-gray-850 rounded-lg flex flex-col overflow-hidden border border-gray-700">
                <div class="p-2 border-b border-gray-700 flex justify-between items-center">
                    <div class="flex items-center space-x-1">
                         <button class="response-panel-tab py-1 px-2 rounded-md text-sm" data-tab="response-body">Body</button>
                         <button class="response-panel-tab py-1 px-2 rounded-md text-sm" data-tab="response-tests">Tests</button>
                    </div>
                    <div id="response-meta" class="text-sm space-x-4">
                        <span id="response-status"></span><span id="response-time"></span><span id="response-size"></span>
                    </div>
                </div>
                <div id="response-body-panel" class="response-panel-content flex-grow overflow-auto p-3">
                     <div id="response-placeholder" class="text-gray-500 flex items-center justify-center h-full">Your API response will appear here...</div>
                    <pre id="response-body-pre" class="text-sm font-mono whitespace-pre-wrap break-all hidden"></pre>
                </div>
                <div id="response-tests-panel" class="response-panel-content hidden flex-grow flex flex-col overflow-auto">
                    <div class="p-2 flex justify-end items-center">
                        <button id="generate-tests-button" class="bg-purple-600 hover:bg-purple-500 text-white font-bold py-1 px-3 rounded-lg text-sm">✨ Generate Tests</button>
                    </div>
                    <div id="tests-spinner" class="hidden absolute inset-0 bg-gray-850 bg-opacity-75 flex items-center justify-center z-10">
                        <div class="w-6 h-6 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
                    </div>
                    <textarea id="tests-textarea" class="w-full flex-grow bg-gray-900 p-2 text-white font-mono text-sm resize-none focus:outline-none" placeholder="assert(response.status).equals(200);"></textarea>
                    <div id="test-results" class="p-2 border-t border-gray-700 text-sm overflow-y-auto h-32 font-mono"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="environments-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center hidden z-50"></div>
    <div id="code-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center hidden z-50"></div>
    <div id="docs-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center hidden z-50"></div>
    <div id="settings-modal" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center hidden z-50"></div>
    <input type="file" id="import-file-input" class="hidden" accept=".json">

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- 1. DOM ELEMENT SELECTORS ---
        const app = document.getElementById('app');
        const collectionsList = document.getElementById('collections-list');
        const historyList = document.getElementById('history-list');
        const requestEditor = document.getElementById('request-editor');
        const centerPanelPlaceholder = document.getElementById('center-panel-placeholder');
        const environmentSelector = document.getElementById('environment-selector');
        const requestNameInput = document.getElementById('request-name-input');
        const methodSelect = document.getElementById('method-select');
        const urlInput = document.getElementById('url-input');
        const headersTextarea = document.getElementById('headers-textarea');
        const bodyTextarea = document.getElementById('body-textarea');
        const testsTextarea = document.getElementById('tests-textarea');
        const sendButton = document.getElementById('send-button');
        const saveRequestButton = document.getElementById('save-request-button');
        const deleteRequestButton = document.getElementById('delete-request-button');
        const generateCodeButton = document.getElementById('generate-code-button');
        const docsHelperButton = document.getElementById('docs-helper-button');
        const generateTestsButton = document.getElementById('generate-tests-button');
        const testsSpinner = document.getElementById('tests-spinner');
        const authTypeSelect = document.getElementById('auth-type-select');
        const authFieldsContainer = document.getElementById('auth-fields');
        const responseBodyPre = document.getElementById('response-body-pre');
        const responsePlaceholder = document.getElementById('response-placeholder');
        const responseStatusEl = document.getElementById('response-status');
        const responseTimeEl = document.getElementById('response-time');
        const responseSizeEl = document.getElementById('response-size');
        const testResultsContainer = document.getElementById('test-results');
        const importFileInput = document.getElementById('import-file-input');
        
        // --- 2. INITIAL STATE & DATA STRUCTURES ---
        let lastResponseData = null;
        let state = {
            collections: [],
            history: [],
            environments: [],
            activeRequestId: null,
            activeEnvironmentId: 'none',
            ui: {
                leftPanelTab: 'collections',
                centerPanelTab: 'body',
                responsePanelTab: 'response-body',
                openFolders: new Set()
            }
        };

        // --- 3. STATE MANAGEMENT ---
        const saveState = () => {
            const stateToSave = { ...state };
            delete stateToSave.ui; // Don't save transient UI state
            localStorage.setItem('apiForgeProState', JSON.stringify(stateToSave));
        };
        const loadState = () => {
            const saved = localStorage.getItem('apiForgeProState');
            if (saved) {
                const parsed = JSON.parse(saved);
                state = { ...state, ...parsed };
                // Rehydrate Set
                state.ui.openFolders = new Set(parsed.ui?.openFolders || []);
            }
        };

        // --- 4. CORE LOGIC ---
        const generateId = (prefix) => `${prefix}_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;
        
        const findItemRecursive = (items, id) => {
            for (const item of items) {
                if (item.id === id) return item;
                if (item.items) {
                    const found = findItemRecursive(item.items, id);
                    if (found) return found;
                }
            }
            return null;
        };
        const findItem = (id) => findItemRecursive(state.collections, id);

        const findItemParentAndIndex = (items, id, parentList = state.collections) => {
            for (let i = 0; i < items.length; i++) {
                const item = items[i];
                if (item.id === id) return { list: parentList, index: i };
                if (item.items) {
                    const found = findItemParentAndIndex(item.items, id, item.items);
                    if (found) return found;
                }
            }
            return null;
        };

        const substituteVariables = (str) => {
            const env = state.environments.find(e => e.id === state.activeEnvironmentId);
            if (!env || !str) return str;
            return str.replace(/\{\{([^}]+)\}\}/g, (match, key) => {
                const variable = env.variables.find(v => v.key === key && v.enabled);
                return variable ? variable.value : match;
            });
        };

        const applyAuth = (headers, request) => {
            if (!request || !request.auth || request.auth.type === 'none') return headers;
            const auth = request.auth;
            switch(auth.type) {
                case 'bearer':
                    headers['Authorization'] = `Bearer ${substituteVariables(auth.token || '')}`;
                    break;
                case 'basic':
                    const user = substituteVariables(auth.username || '');
                    const pass = substituteVariables(auth.password || '');
                    headers['Authorization'] = `Basic ${btoa(`${user}:${pass}`)}`;
                    break;
                case 'apikey':
                    const key = substituteVariables(auth.key || '');
                    const val = substituteVariables(auth.value || '');
                    if (auth.in === 'header') headers[key] = val;
                    break;
            }
            return headers;
        };

        const runTests = (testScript, response) => {
            testResultsContainer.innerHTML = '';
            let passed = 0, failed = 0;
            const log = (message, color) => {
                const div = document.createElement('div');
                div.textContent = message;
                div.style.color = color;
                testResultsContainer.appendChild(div);
            };
            try {
                const assert = (value) => ({
                    equals: (expected) => {
                        if (value === expected) {
                            log(`✅ PASS: Expected ${value} to equal ${expected}`, 'lightgreen'); passed++;
                        } else {
                            log(`❌ FAIL: Expected ${value} to equal ${expected}`, 'salmon'); failed++;
                        }
                    },
                    exists: () => {
                        if (value !== undefined && value !== null) {
                            log(`✅ PASS: Value exists`, 'lightgreen'); passed++;
                        } else {
                            log(`❌ FAIL: Value does not exist`, 'salmon'); failed++;
                        }
                    }
                });
                (new Function('response', 'assert', testScript))(response, assert);
            } catch (e) { log(`🚨 ERROR: ${e.message}`, 'red'); }
            log(`\nResults: ${passed} passed, ${failed} failed.`, 'white');
        };

        const generateCodeSnippets = (request) => {
            if (!request) return { curl: 'Select a request to generate code.' };
            const fullUrl = substituteVariables(request.url);
            let headers = {};
            try { headers = JSON.parse(substituteVariables(request.headers || '{}')) } catch(e){}
            headers = applyAuth(headers, request);
            const headerString = Object.entries(headers).map(([k,v]) => `-H '${k}: ${v}'`).join(' ');
            const bodyString = (request.method !== 'GET' && request.body) ? `-d '${substituteVariables(request.body)}'` : '';
            const curl = `curl --request ${request.method} '${fullUrl}' ${headerString} ${bodyString}`;
            return { curl };
        };

        // --- 5. GEMINI API INTEGRATION ---
        async function callGeminiAPI(prompt) {
            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                throw new Error("Gemini API Key is missing. Please add it in Settings (⚙️).");
            }
            // Updated to stable, widely-supported model
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
            };

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            if (!response.ok) {
                const errorBody = await response.json();
                throw new Error(`API Error (${response.status}): ${errorBody.error?.message || 'Unknown error'}`);
            }
            const result = await response.json();
            return result.candidates?.[0]?.content?.parts?.[0]?.text || "";
        }

        // --- 6. RENDERING FUNCTIONS ---
        const render = () => {
            saveState();
            renderCollections();
            renderHistory();
            renderEnvironments();
            renderActiveRequest();
            renderLeftPanelTabs();
        };

        const renderLeftPanelTabs = () => {
            document.querySelectorAll('.left-panel-tab').forEach(t => t.classList.remove('active-tab'));
            const activeTab = document.querySelector(`.left-panel-tab[data-tab="${state.ui.leftPanelTab}"]`);
            if (activeTab) activeTab.classList.add('active-tab');
            
            document.querySelectorAll('.left-panel-content').forEach(p => p.classList.add('hidden'));
            const activePanel = document.getElementById(`${state.ui.leftPanelTab}-panel`);
            if (activePanel) activePanel.classList.remove('hidden');
        };

        const renderCollections = () => {
            const renderTree = (items, level = 0) => {
                let html = '';
                items.forEach(item => {
                    const isActive = item.id === state.activeRequestId;
                    if (item.type === 'folder' || item.type === 'collection') {
                        const isOpen = state.ui.openFolders.has(item.id);
                        html += `<div class="folder ${isOpen ? 'open' : ''}" style="--level: ${level}">
                                <div data-id="${item.id}" data-type="${item.type}" class="item-content flex justify-between items-center p-1 rounded-md hover:bg-gray-700 cursor-pointer">
                                    <span class="font-bold truncate">${item.name}</span><div class="flex space-x-1">
                                    <button class="new-folder-btn text-xs bg-gray-600 px-1 rounded hover:bg-gray-500" data-id="${item.id}">+F</button>
                                    <button class="new-request-btn text-xs bg-blue-600 px-1 rounded hover:bg-blue-500" data-id="${item.id}">+R</button></div></div>
                                <div class="children ${isOpen ? '' : 'hidden'}">${renderTree(item.items || [], level + 1)}</div></div>`;
                    } else {
                        html += `<div style="--level: ${level}" class="item"><div data-id="${item.id}" data-type="request" class="item-content flex justify-between items-center p-1 rounded-md hover:bg-gray-700 cursor-pointer ${isActive ? 'active-request' : ''}">
                                <span class="truncate"><span class="font-bold text-xs w-12 inline-block ${item.method === 'GET' ? 'text-green-400' : item.method === 'POST' ? 'text-yellow-400' : item.method === 'DELETE' ? 'text-red-400' : 'text-blue-400'}">${item.method}</span> ${item.name}</span></div></div>`;
                    }
                });
                return html;
            };
            collectionsList.innerHTML = renderTree(state.collections);
        };

        const renderHistory = () => {
            historyList.innerHTML = state.history.slice().reverse().map(h => `
                <div data-id="${h.id}" class="history-item p-2 rounded-md hover:bg-gray-700 cursor-pointer border-l-2 border-transparent hover:border-blue-500">
                    <div><span class="font-bold text-xs w-12 inline-block ${h.method === 'GET' ? 'text-green-400' : 'text-yellow-400'}">${h.method}</span> <span class="truncate inline-block max-w-[150px]">${h.name}</span></div>
                    <div class="text-xs text-gray-400 truncate">${h.url}</div></div>`).join('');
        };
        
        const renderEnvironments = () => {
            environmentSelector.innerHTML = `<option value="none">No Environment</option>` + 
                state.environments.map(e => `<option value="${e.id}" ${e.id === state.activeEnvironmentId ? 'selected' : ''}>${e.name}</option>`).join('');
        };

        const renderActiveRequest = () => {
            const request = findItem(state.activeRequestId);
            if (!request) {
                requestEditor.classList.add('hidden');
                centerPanelPlaceholder.classList.remove('hidden'); 
                centerPanelPlaceholder.classList.add('flex');
                return;
            }
            requestEditor.classList.remove('hidden');
            centerPanelPlaceholder.classList.add('hidden');
            centerPanelPlaceholder.classList.remove('flex');
            requestNameInput.value = request.name;
            methodSelect.value = request.method;
            urlInput.value = request.url;
            headersTextarea.value = request.headers || '';
            bodyTextarea.value = request.body || '';
            testsTextarea.value = request.tests || '';
            request.auth = request.auth || { type: 'none' };
            authTypeSelect.value = request.auth.type;
            renderAuthFields(request.auth);
        };
        
        const renderAuthFields = (auth) => {
            let html = '';
            switch (auth.type) {
                case 'bearer': html = `<input type="text" id="bearer-token" placeholder="Token" value="${auth.token || ''}" class="w-full bg-gray-900 p-2 rounded-md border border-gray-700">`; break;
                case 'basic': html = `<div class="space-y-2"><input type="text" id="basic-user" placeholder="Username" value="${auth.username || ''}" class="w-full bg-gray-900 p-2 rounded-md border border-gray-700"><input type="password" id="basic-pass" placeholder="Password" value="${auth.password || ''}" class="w-full bg-gray-900 p-2 rounded-md border border-gray-700"></div>`; break;
                case 'apikey': html = `<div class="space-y-2"><input type="text" id="apikey-key" placeholder="Key" value="${auth.key || ''}" class="w-full bg-gray-900 p-2 rounded-md border border-gray-700"><input type="text" id="apikey-value" placeholder="Value" value="${auth.value || ''}" class="w-full bg-gray-900 p-2 rounded-md border border-gray-700"><select id="apikey-in" class="w-full bg-gray-700 p-2 rounded-md"><option value="header" ${auth.in === 'header' ? 'selected': ''}>Header</option><option value="query" ${auth.in === 'query' ? 'selected': ''}>Query Parameter</option></select></div>`; break;
            }
            authFieldsContainer.innerHTML = html;
        };

        const renderResponse = ({ status, statusText, data, time, size, testsResponse }) => {
            lastResponseData = testsResponse;
            responsePlaceholder.classList.add('hidden');
            responseBodyPre.classList.remove('hidden');
            try { 
                const parsed = JSON.parse(data);
                responseBodyPre.innerHTML = syntaxHighlight(JSON.stringify(parsed, null, 2));
            } catch(e) { 
                responseBodyPre.textContent = data; 
            }
            let statusClass = 'text-gray-400';
            if (status >= 200 && status < 300) statusClass = 'text-green-500';
            if (status >= 400) statusClass = 'text-red-500';
            responseStatusEl.innerHTML = `<span class="${statusClass} font-bold">${status} ${statusText}</span>`;
            responseTimeEl.textContent = `${time}ms`;
            responseSizeEl.textContent = `${(size/1024).toFixed(2)} KB`;
            if (testsResponse && state.ui.responsePanelTab === 'response-tests') {
                runTests(testsTextarea.value, testsResponse);
            }
        };

        const syntaxHighlight = (json) => {
            json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'json-number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'json-key';
                    } else {
                        cls = 'json-string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'json-boolean';
                } else if (/null/.test(match)) {
                    cls = 'json-null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        };

        const showModal = (container, content) => {
            container.innerHTML = `<div class="modal-content bg-gray-850 rounded-lg shadow-xl w-full max-w-2xl border border-gray-700 animate-in m-4">${content}</div>`;
            container.classList.remove('hidden');
        };

        const hideModal = (container) => {
            const content = container.querySelector('.modal-content');
            if (content) {
                content.classList.remove('animate-in'); content.classList.add('animate-out');
                setTimeout(() => { container.classList.add('hidden'); container.innerHTML = ''; }, 200);
            } else { container.classList.add('hidden'); }
        };

        // --- 7. EVENT HANDLERS ---
        app.addEventListener('click', e => {
            const target = e.target.closest('[data-tab], .item-content, .new-request-btn, .new-folder-btn, .history-item, #clear-history-button');
            if (!target) return;
            if (target.matches('[data-tab]')) {
                const tabType = target.classList.contains('left-panel-tab') ? 'leftPanelTab' : (target.classList.contains('response-panel-tab') ? 'responsePanelTab' : 'centerPanelTab');
                state.ui[tabType] = target.dataset.tab;
                render();
                // Re-run tests if switching to tests tab and data exists
                if (tabType === 'responsePanelTab' && target.dataset.tab === 'response-tests' && lastResponseData) {
                    runTests(testsTextarea.value, lastResponseData);
                }
            } else if (target.matches('.item-content')) {
                const { id, type } = target.dataset;
                if (type === 'folder' || type === 'collection') {
                    state.ui.openFolders.has(id) ? state.ui.openFolders.delete(id) : state.ui.openFolders.add(id);
                } else { state.activeRequestId = id; }
                render();
            } else if (target.matches('.new-request-btn, .new-folder-btn')) {
                const parentId = target.dataset.id;
                const parent = findItem(parentId);
                if (parent && parent.items) {
                    const isRequest = target.matches('.new-request-btn');
                    const newItem = isRequest ? 
                        { id: generateId('req'), name: 'New Request', type: 'request', method: 'GET', url: '', headers: '{}', body: '' } :
                        { id: generateId('fld'), name: 'New Folder', type: 'folder', items: [] };
                    parent.items.push(newItem);
                    if (isRequest) state.activeRequestId = newItem.id;
                    state.ui.openFolders.add(parentId);
                    render();
                }
            } else if(target.matches('.history-item')) {
                const req = state.history.find(h => h.id === target.dataset.id);
                if(state.collections.length > 0) {
                     const newReq = { ...req, id: generateId('req'), name: req.name + " (from history)", type: 'request' };
                     state.collections[0].items.push(newReq);
                     state.activeRequestId = newReq.id;
                     state.ui.openFolders.add(state.collections[0].id);
                     state.ui.leftPanelTab = 'collections';
                     render();
                } else alert("Create a collection first.");
            } else if (target.id === 'clear-history-button' && confirm('Clear all history?')) {
                state.history = []; render();
            }
        });
        
        document.getElementById('new-collection-button').addEventListener('click', () => {
            state.collections.push({ id: generateId('col'), name: 'New Collection', type: 'collection', items: [] });
            render();
        });

        deleteRequestButton.addEventListener('click', () => {
            if (!state.activeRequestId) return;
            if (confirm('Delete this request?')) {
                const result = findItemParentAndIndex(state.collections, state.activeRequestId);
                if (result) {
                    result.list.splice(result.index, 1);
                    state.activeRequestId = null;
                    render();
                }
            }
        });
        
        saveRequestButton.addEventListener('click', () => {
            const request = findItem(state.activeRequestId);
            if (!request) return;
            request.name = requestNameInput.value;
            request.method = methodSelect.value;
            request.url = urlInput.value;
            request.headers = headersTextarea.value;
            request.body = bodyTextarea.value;
            request.tests = testsTextarea.value;
            const auth = { type: authTypeSelect.value };
            switch(auth.type) {
                case 'bearer': auth.token = document.getElementById('bearer-token')?.value || ''; break;
                case 'basic': auth.username = document.getElementById('basic-user')?.value || ''; auth.password = document.getElementById('basic-pass')?.value || ''; break;
                case 'apikey': auth.key = document.getElementById('apikey-key')?.value || ''; auth.value = document.getElementById('apikey-value')?.value || ''; auth.in = document.getElementById('apikey-in')?.value || 'header'; break;
            }
            request.auth = auth;
            render();
        });
        
        sendButton.addEventListener('click', async () => {
            let request = findItem(state.activeRequestId); if (!request) return;
            request = JSON.parse(JSON.stringify(request));
            let url = substituteVariables(request.url);
            if (!url) { alert('URL is empty.'); return; }
            
            // Ensure URL has protocol
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            const startTime = Date.now();
            let headers = {};
            try { headers = JSON.parse(substituteVariables(request.headers || '{}')) } catch(e){}
            headers = applyAuth(headers, request);
            
            if (request.auth?.type === 'apikey' && request.auth.in === 'query') {
                const urlObj = new URL(url);
                urlObj.searchParams.set(substituteVariables(request.auth.key), substituteVariables(request.auth.value));
                url = urlObj.toString();
            }
            
            const options = { method: request.method, headers };
            if (request.method !== 'GET' && request.body) options.body = substituteVariables(request.body);
            
            try {
                const response = await fetch(url, options);
                const data = await response.text();
                const endTime = Date.now();
                
                state.history.push({ ...findItem(state.activeRequestId), timestamp: Date.now() });
                if(state.history.length > 50) state.history.shift();
                
                let testsResponse = { status: response.status, body: data, headers: Object.fromEntries(response.headers.entries())};
                try { testsResponse.json = JSON.parse(data) } catch (e) {}
                
                renderResponse({ status: response.status, statusText: response.statusText, data, time: endTime - startTime, size: new Blob([data]).size, testsResponse });
                renderHistory();
            } catch (error) { 
                renderResponse({ status: 'Error', statusText: 'Network Failed', data: `CORS or Network Error: ${error.message}\n\nNote: If testing a local API, ensure it allows CORS, or use a CORS proxy.`, time: 0, size: 0 }); 
            }
        });

        generateTestsButton.addEventListener('click', async () => {
            if (!lastResponseData || !lastResponseData.json) {
                alert("Please run a request that returns a valid JSON body first.");
                return;
            }
            testsSpinner.classList.remove('hidden');
            const request = findItem(state.activeRequestId);
            const prompt = `You are a QA engineer. Based on this API request and JSON response, write a JavaScript test script using the provided 'assert' function. The tests should validate the response structure and content. Only output raw code, no explanations, no markdown blocks.
Request: ${request.method} ${request.url}
Response Status: ${lastResponseData.status}
Response Body: ${JSON.stringify(lastResponseData.json, null, 2)}
Available Assertions: assert(value).equals(expected); and assert(value).exists();`;
            try {
                let generatedTests = await callGeminiAPI(prompt);
                // Clean up markdown if the model still adds it
                generatedTests = generatedTests.replace(/```javascript|```/g, '').trim();
                testsTextarea.value = generatedTests;
                runTests(generatedTests, lastResponseData);
            } catch (e) {
                alert(`Failed to generate tests: ${e.message}`);
            } finally {
                testsSpinner.classList.add('hidden');
            }
        });

        docsHelperButton.addEventListener('click', async () => {
            const request = findItem(state.activeRequestId);
            if (!request) return;
            const content = `<div class="p-4 border-b border-gray-700 flex justify-between items-center"><h3 class="text-xl font-bold text-white">✨ AI Documentation Helper</h3><button class="close-modal-btn text-gray-400 hover:text-white text-2xl">&times;</button></div><div id="docs-content" class="p-6 min-h-[200px] flex items-center justify-center"><div class="w-6 h-6 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div></div>`;
            showModal(document.getElementById('docs-modal'), content);

            const prompt = `You are a technical writer. Based on the following API request, write a concise, one-paragraph description of what this endpoint likely does. Then, provide a sample cURL command. Format the output with a "Description:" header and a "cURL Command:" header.
Request Method: ${request.method}
Request URL: ${request.url}
Request Body: ${request.body || '(No Body)'}`;

            try {
                const documentation = await callGeminiAPI(prompt);
                const parts = documentation.split(/cURL Command:/i);
                const desc = parts[0].replace(/Description:/i, '').trim();
                const curl = parts[1] ? parts[1].trim().replace(/```bash|```/g, '') : 'Could not generate cURL.';
                
                document.getElementById('docs-content').innerHTML = `<div class="space-y-4">
                    <h4 class="text-lg font-semibold text-white">Description</h4>
                    <p class="text-gray-300 leading-relaxed">${desc}</p>
                    <h4 class="text-lg font-semibold text-white">cURL Command</h4>
                    <pre class="bg-gray-950 p-3 rounded-md text-sm whitespace-pre-wrap break-all text-green-400 font-mono border border-gray-700">${curl}</pre>
                </div>`;
            } catch (e) {
                document.getElementById('docs-content').innerHTML = `<p class="text-red-500">Failed to generate documentation: ${e.message}</p>`;
            }
        });

        // Settings Modal Logic
        document.getElementById('settings-button').addEventListener('click', () => {
            const currentKey = localStorage.getItem('gemini_api_key') || '';
            const content = `
                <div class="p-4 border-b border-gray-700 flex justify-between items-center">
                    <h3 class="text-xl font-bold text-white">⚙️ Settings</h3>
                    <button class="close-modal-btn text-gray-400 hover:text-white text-2xl">&times;</button>
                </div>
                <div class="p-6 space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-2">Gemini API Key</label>
                        <input type="password" id="gemini-api-key-input" value="${currentKey}" placeholder="Enter your Google AI Studio API key" class="w-full bg-gray-900 border border-gray-700 rounded-md p-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <p class="text-xs text-gray-400 mt-2">Your key is stored locally in your browser. <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-blue-400 hover:underline">Get a key here</a>.</p>
                    </div>
                    <div class="flex justify-end">
                        <button id="save-settings-btn" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-lg text-sm">Save Settings</button>
                    </div>
                </div>`;
            showModal(document.getElementById('settings-modal'), content);
            
            document.getElementById('save-settings-btn').addEventListener('click', () => {
                const key = document.getElementById('gemini-api-key-input').value.trim();
                if (key) {
                    localStorage.setItem('gemini_api_key', key);
                    alert('API Key saved successfully!');
                    hideModal(document.getElementById('settings-modal'));
                } else {
                    localStorage.removeItem('gemini_api_key');
                    alert('API Key removed.');
                    hideModal(document.getElementById('settings-modal'));
                }
            });
        });

        authTypeSelect.addEventListener('change', e => renderAuthFields({ type: e.target.value }));
        environmentSelector.addEventListener('change', e => { state.activeEnvironmentId = e.target.value; saveState(); });
        
        document.getElementById('environments-button').addEventListener('click', () => { 
            showModal(document.getElementById('environments-modal'), `
                <div class="p-4 border-b border-gray-700 flex justify-between items-center">
                    <h3 class="text-xl font-bold text-white">Manage Environments</h3>
                    <button class="close-modal-btn text-gray-400 hover:text-white text-2xl">&times;</button>
                </div>
                <div class="p-6 text-center text-gray-400 space-y-4">
                    <p>Environments can be managed by exporting your collections, editing the JSON file, and re-importing.</p>
                    <div class="flex justify-center space-x-4">
                        <button id="export-env-btn" class="bg-blue-600 hover:bg-blue-500 text-white py-2 px-4 rounded-md text-sm">Export Current Setup</button>
                    </div>
                </div>`);
            document.getElementById('export-env-btn').addEventListener('click', () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ collections: state.collections, environments: state.environments }, null, 2));
                const a = document.createElement('a'); a.setAttribute("href", dataStr); a.setAttribute("download", "api-forge-export.json");
                document.body.appendChild(a); a.click(); a.remove();
            });
        });

        generateCodeButton.addEventListener('click', () => { 
            const snippets = generateCodeSnippets(findItem(state.activeRequestId)); 
            showModal(document.getElementById('code-modal'), `
                <div class="p-4 border-b border-gray-700 flex justify-between items-center">
                    <h3 class="text-xl font-bold text-white">Generate Code</h3>
                    <button class="close-modal-btn text-gray-400 hover:text-white text-2xl">&times;</button>
                </div>
                <div class="p-6">
                    <h4 class="text-lg font-semibold mb-2 text-white">cURL</h4>
                    <pre class="bg-gray-950 p-3 rounded-md text-sm whitespace-pre-wrap break-all text-green-400 font-mono border border-gray-700">${snippets.curl}</pre>
                </div>`); 
        });

        // Modal close handlers
        document.querySelectorAll('[id$="-modal"]').forEach(m => {
            m.addEventListener('click', e => { 
                if (e.target === m || e.target.classList.contains('close-modal-btn')) {
                    hideModal(m); 
                }
            });
        });

        importFileInput.addEventListener('change', e => { 
            const file = e.target.files[0]; if (!file) return; 
            const reader = new FileReader(); 
            reader.onload = (event) => { 
                try { 
                    const data = JSON.parse(event.target.result); 
                    if (data.collections && data.environments) { 
                        state.collections = data.collections; 
                        state.environments = data.environments; 
                        render(); 
                        alert('Import successful!');
                    } else {
                        alert('Invalid file format.'); 
                    }
                } catch (err) { 
                    alert('Error parsing file.'); 
                } 
            }; 
            reader.readAsText(file); 
        });
        
        document.getElementById('import-button').addEventListener('click', () => importFileInput.click());
        
        document.getElementById('export-button').addEventListener('click', () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ collections: state.collections, environments: state.environments }, null, 2));
            const a = document.createElement('a'); a.setAttribute("href", dataStr); a.setAttribute("download", "api-forge-export.json");
            document.body.appendChild(a); a.click(); a.remove();
        });

        // --- 8. INITIALIZATION ---
        loadState();
        render();
        
        // Set default tabs if not set
        if (!state.ui.centerPanelTab) state.ui.centerPanelTab = 'body';
        if (!state.ui.responsePanelTab) state.ui.responsePanelTab = 'response-body';
        
        const bodyTab = document.querySelector('.tab-btn[data-tab="body"]');
        if (bodyTab) bodyTab.click();
        const responseBodyTab = document.querySelector('.response-panel-tab[data-tab="response-body"]');
        if (responseBodyTab) responseBodyTab.click();
    });
    </script>
</body>
</html>
